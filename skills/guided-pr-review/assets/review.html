    case 'explain': state.ui.openExplain.add(data.hunk); return sendEvent({ type: 'explain', hunkId: data.hunk });
    case 'cancel-remark': state.ui.composer = null; return render();
    case 'save-remark': {
      const composer = state.ui.composer;
      const textarea = document.getElementById('composer');
      const body = textarea.value.trim();
      if (!body) return toast('Write the remark first.', true);
      state.reviewer.remarks.push({ id: crypto.randomUUID(), hunkId: composer.hunkId, startLine: composer.startLine, startSide: composer.startSide, line: composer.line, side: composer.side, severity: document.getElementById('composer-severity').value, body, ...(composer.aiSuggested && { aiSuggested: true }), ...(composer.copiedFrom && { copiedFrom: composer.copiedFrom }) });
      delete state.ui.drafts[textarea.dataset.draft];
      state.ui.composer = null;
      saveReviewer();
      if (composer.thenNext) return step(1);
      return render();
    }
  }
});

function openComposer(composer) {
  state.ui.composer = composer;
  render();
  document.getElementById('composer')?.focus();
}

function markSelecting(hunkId, from, to) {
  const [low, high] = from <= to ? [from, to] : [to, from];
  document.querySelectorAll(`tr[data-hunk-row="${hunkId}"]`).forEach((row) => {
    const index = Number(row.dataset.row);
    row.classList.toggle('selecting', index >= low && index <= high);
  });
}

document.addEventListener('pointerdown', (event) => {
  const button = event.target.closest('button[data-remark]');
  if (!button || event.button !== 0) return;
  event.preventDefault();
  const hunkId = button.dataset.remark;
  const row = Number(button.dataset.row);
  const composer = state.ui.composer;
  const anchor = event.shiftKey && composer && composer.hunkId === hunkId
    ? rowIndexOf(diffRows(hunkById(hunkId)), composer.startLine, composer.startSide)
    : row;
  state.ui.drag = { hunkId, anchor, current: row };
  markSelecting(hunkId, anchor, row);
});

document.addEventListener('pointermove', (event) => {
  const drag = state.ui.drag;
  if (!drag) return;
  const row = document.elementFromPoint(event.clientX, event.clientY)?.closest(`tr[data-hunk-row="${drag.hunkId}"]`);
  if (!row || Number(row.dataset.row) === drag.current) return;
  drag.current = Number(row.dataset.row);
  markSelecting(drag.hunkId, drag.anchor, drag.current);
});

document.addEventListener('pointerup', () => {
  const drag = state.ui.drag;
  if (!drag) return;
  state.ui.drag = null;
  openComposer(composerFor(hunkById(drag.hunkId), drag.anchor, drag.current));
});

document.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey || event.defaultPrevented || !state.review) return;
  if (event.target.closest('input, textarea, select, [contenteditable]') || document.querySelector('dialog[open]')) return;
  const shortcut = SHORTCUTS.find(([key]) => key === event.key);
  if (!shortcut) return;
  event.preventDefault();
  shortcut[2]();
});

document.querySelector('#shortcuts dl').innerHTML = SHORTCUTS.map(([key, label]) => `<div><dt><kbd>${escapeHtml(key)}</kbd></dt><dd>${label}</dd></div>`).join('');
document.querySelector('#file-view [data-close-dialog]').innerHTML = ICONS.close;
// Light dismiss is native through closedby; this is the fallback for browsers without it.
for (const dialog of document.querySelectorAll('dialog')) {
  if (!('closedBy' in HTMLDialogElement.prototype)) {
    dialog.addEventListener('click', (event) => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      const inside = rect.top <= event.clientY && event.clientY <= rect.bottom && rect.left <= event.clientX && event.clientX <= rect.right;
      if (!inside) closeTopLayer(dialog);
    });
  }
  dialog.addEventListener('cancel', (event) => { event.preventDefault(); closeTopLayer(dialog); });
  dialog.querySelector('[data-close-shortcuts], [data-close-dialog]').addEventListener('click', () => closeTopLayer(dialog));
}

// Browsers that cannot keep a closing dialog in the top layer get the exit animation through data-closing first.
let displayTransitions;
function canTransitionDisplay() {
  if (displayTransitions !== undefined) return displayTransitions;
  if (!window.CSS?.supports?.('transition-behavior', 'allow-discrete')) return (displayTransitions = false);
  const probe = document.createElement('div');
  probe.style.cssText = 'transition: display 1s allow-discrete !important; display: block;';
  document.body.appendChild(probe);
  getComputedStyle(probe).display;
  probe.style.display = 'none';
  displayTransitions = getComputedStyle(probe).display === 'block';
  probe.remove();
  return displayTransitions;
}

async function closeTopLayer(element) {
  if (!(window.CSS?.supports?.('overlay', 'auto') && canTransitionDisplay())) {
    element.setAttribute('data-closing', '');
    const animations = element.getAnimations({ subtree: true });
    if (animations.length) await Promise.race([Promise.allSettled(animations.map((animation) => animation.finished)), new Promise((resolve) => setTimeout(resolve, 2000))]);
    if (!element.hasAttribute('data-closing')) return;
    element.removeAttribute('data-closing');
  }
  element.close();
}

// Browsers without the popover attribute get the polyfill; only they load it.
if (!('popover' in HTMLElement.prototype)) import('https://cdn.jsdelivr.net/npm/@oddbird/popover-polyfill@0.7.3/dist/popover.min.js');

// The map scrolls sideways with a vertical wheel and with a mouse drag. At either end the wheel scrolls the page again.
function scrollMapWithWheel(event) {
  const map = event.currentTarget;
  if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
  const max = map.scrollWidth - map.clientWidth;
  const next = Math.max(0, Math.min(max, map.scrollLeft + event.deltaY));
  if (max <= 0 || next === map.scrollLeft) return;
  event.preventDefault();
  map.scrollLeft = next;
}

// Once a drag moves, the map captures the pointer, so the button under it never gets the click.
let mapDrag = null;
document.addEventListener('pointerdown', (event) => {
  const map = event.target.closest?.('.map');
  if (!map || event.pointerType !== 'mouse' || event.button !== 0 || map.scrollWidth <= map.clientWidth) return;
  mapDrag = { map, x: event.clientX, left: map.scrollLeft, moved: false };
});
document.addEventListener('pointermove', (event) => {
  if (!mapDrag) return;
  if (!(event.buttons & 1)) return endMapDrag();
  const distance = event.clientX - mapDrag.x;
  if (!mapDrag.moved && Math.abs(distance) < 4) return;
  if (!mapDrag.moved) mapDrag.map.setPointerCapture(event.pointerId);
  mapDrag.moved = true;
  mapDrag.map.classList.add('dragging');
  mapDrag.map.scrollLeft = mapDrag.left - distance;
});
// A drag also ends when the browser cancels the pointer or the button is no longer down.
function endMapDrag() {
  if (!mapDrag) return;
  mapDrag.map.classList.remove('dragging');
  mapDrag = null;
}
document.addEventListener('pointerup', endMapDrag);
document.addEventListener('pointercancel', endMapDrag);

// Scrolling down a hunk shrinks the map to its dots, so the diff gets the room; scrolling back up shows it in full.
document.addEventListener('scroll', (event) => {
  const scroller = event.target;
  if (!scroller.matches?.('.main')) return;
  const current = Boolean(state.ui.compactMap);
  const compact = scroller.scrollTop > 120 ? true : scroller.scrollTop < 40 ? false : current;
  if (compact === current) return;
  const strip = document.querySelector('.strip');
  // A smaller header leaves less to scroll, and the browser pulls the reader back up to the new end.
  // The header only shrinks when the current scroll position still fits afterwards. Measuring the compact header
  // also moves the scroll position to that end, so the position is put back.
  if (compact && strip) {
    const top = scroller.scrollTop;
    strip.classList.add('compact');
    const room = scroller.scrollHeight - scroller.clientHeight;
    strip.classList.remove('compact');
    scroller.scrollTop = top;
    if (room < top) return;
  }
  state.ui.compactMap = compact;
  if (strip) setStripClass(strip, 'compact', compact);
}, true);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

// The header animates between its two layouts: the height changes, the map slides from its old place to its new one,
// and the parts that only the full header shows fade, so nothing jumps when the layout switches.
const STRIP_PARTS = '.line-route, .criteria, .legend-wrap, .stop-name, .stop-tags';
const STRIP_EASE = 'cubic-bezier(.22, 1, .36, 1)';

function setStripClass(strip, name, on) {
  if (strip.dataset[name] === String(on) || (!strip.dataset[name] && strip.classList.contains(name) === on)) return;
  strip.dataset[name] = String(on);
  for (const animation of strip.getAnimations({ subtree: true })) animation.cancel();
  const collapsing = name === 'compact' ? on : !on;
  if (reduceMotion.matches) return strip.classList.toggle(name, on);
  if (!collapsing) return switchStripLayout(strip, name, on);
  // The parts that leave fade out first, then the header shrinks.
  const fades = [...strip.querySelectorAll(STRIP_PARTS)].map((part) => part.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-in', fill: 'forwards' }));
  Promise.all(fades.map((fade) => fade.finished)).then(() => {
    if (strip.dataset[name] !== String(on)) return;
    switchStripLayout(strip, name, on);
    fades.forEach((fade) => fade.cancel());
  }, () => {});
}

function switchStripLayout(strip, name, on) {
  const map = strip.querySelector('.map');
  const from = strip.getBoundingClientRect().height;
  const mapFrom = map?.getBoundingClientRect().top;
  strip.classList.toggle(name, on);
  const to = strip.getBoundingClientRect().height;
  if (from === to) return;
  const timing = { duration: to > from ? 340 : 280, easing: STRIP_EASE };
  strip.style.overflow = 'hidden';
  const resize = strip.animate([{ height: `${from}px` }, { height: `${to}px` }], timing);
  resize.onfinish = resize.oncancel = () => { strip.style.overflow = ''; };
  if (map) map.animate([{ transform: `translateY(${mapFrom - map.getBoundingClientRect().top}px)` }, { transform: 'none' }], timing);
  if (to > from) for (const part of strip.querySelectorAll(STRIP_PARTS)) part.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 140, easing: 'ease-out', fill: 'backwards' });
}

// A file name cut off on the map shows its full path on hover. It is measured on hover, because a compact header hides the names.
document.addEventListener('mouseover', (event) => {
  const name = event.target.closest?.('.stop-name');
  if (name && !name.title && name.scrollWidth > name.clientWidth) name.title = name.dataset.path;
});

// Resting the pointer on the compact header shows it in full; a short delay keeps a passing pointer from opening it.
let peekTimer = null;
document.addEventListener('mouseover', (event) => {
  const strip = event.target.closest?.('.strip.compact');
  if (!strip || strip.classList.contains('peek') || peekTimer) return;
  peekTimer = setTimeout(() => { peekTimer = null; setStripClass(strip, 'peek', true); }, 250);
});
document.addEventListener('mouseout', (event) => {
  const strip = event.target.closest?.('.strip');
  if (!strip || strip.contains(event.relatedTarget)) return;
  clearTimeout(peekTimer);
  peekTimer = null;
  setStripClass(strip, 'peek', false);
});

// The popover tells the page when it opens or closes; only the round button is drawn again.
document.addEventListener('toggle', (event) => {
  if (event.target.id !== 'ask-panel' || !event.target.isConnected) return;
  if (event.target.dataset.reopened && event.newState === 'open') { delete event.target.dataset.reopened; return; }
  const open = event.newState === 'open';
  if (open === state.ui.askOpen) return;
  state.ui.askOpen = open;
  const station = state.view.kind === 'station' ? lineById(state.view.line).stops[state.view.index] : null;
  const fab = document.querySelector('.ask-fab');
  if (station && fab) fab.outerHTML = askFab(hunkById(station.hunkId), open);
  if (open) event.target.querySelector('textarea')?.focus();
  else document.querySelector('.ask-fab')?.focus();
}, true);

document.addEventListener('toggle', (event) => {
  const hunkId = event.target.dataset?.explainFor;
  if ('legend' in event.target.dataset) { state.ui.legendOpen = event.target.open; return; }
  if ('criteria' in event.target.dataset) { state.ui.criteriaOpen = event.target.open; return; }
  if ('switcher' in event.target.dataset) {
    // A redraw creates the element open again, which fires toggle without a change.
    if (event.target.open === Boolean(state.ui.switcherOpen)) return;
    state.ui.switcherOpen = event.target.open;
    // Another review may have started or stopped since the list was read.
    if (event.target.open) loadReviews().then(render);
    return;
  }
  if (event.target.dataset?.termSection) { state.ui.terminusOpen = { ...state.ui.terminusOpen, [event.target.dataset.termSection]: event.target.open }; return; }
  if (!hunkId) return;
  if (event.target.open) state.ui.openExplain.add(hunkId); else state.ui.openExplain.delete(hunkId);
}, true);

document.addEventListener('input', (event) => {
  const target = event.target;
  if (target.dataset.draft) state.ui.drafts[target.dataset.draft] = target.value;
  if (target.dataset.edit) state.ui.drafts[`edit:${target.dataset.edit}`] = target.value;
  if ('summary' in target.dataset) {
    state.reviewer.summary = target.value;
    // Once the reviewer clears the AI draft, what they write is their own.
    if (!target.value.trim()) state.reviewer.summaryAiSuggested = false;
    saveReviewer();
    // Only the preview is drawn again, so the textarea keeps focus and caret.
    const preview = document.querySelector('.preview');
    if (preview) preview.innerHTML = previewHtml(buildPost('final').event);
  }
  if ('updateNote' in target.dataset) { state.reviewer.updateNote = target.value; saveReviewer(); }
  if (target.dataset.threadReply) { state.reviewer.threadReplies[target.dataset.threadReply] = target.value; saveReviewer(); }
});

function noteFreshHunks() {
  const known = state.reviewer.knownHunks || [];
  if (known.length) {
    for (const id of allHunkIds()) if (!known.includes(id) && !isSeen(id)) state.freshHunks.add(id);
  }
  state.reviewer.knownHunks = allHunkIds();
}

function pendingSummaryDraft() {
  const asked = sentEvents('summarize').at(-1);
  const answer = asked && answerFor(asked.id);
  return answer && state.reviewer.summaryFrom !== asked.id ? { eventId: asked.id, text: answer.answer } : null;
}

function useSummaryDraft(eventId) {
  const draft = pendingSummaryDraft();
  if (!draft || draft.eventId !== eventId) return;
  Object.assign(state.reviewer, { summary: draft.text.trim(), summaryFrom: eventId, summaryAiSuggested: true });
  saveReviewer();
}

// Text the reviewer wrote is never overwritten without asking.
function applySummaryDraft() {
  const draft = pendingSummaryDraft();
  if (draft && !state.reviewer.summary.trim()) useSummaryDraft(draft.eventId);
}

async function poll() {
  try {
    // Only this request tells whether the server still answers; fetch then rejects with a TypeError.
    const review = await transport.loadReview().catch((error) => {
      if (error instanceof TypeError) error.serverGone = true;
      throw error;
    });
    const json = JSON.stringify(review);
    if (json !== state.reviewJson) {
      setReview(review, json);
      noteFreshHunks();
      importOwnReview();
      startRoundOnNewCommits();
      applySummaryDraft();
      render();
    }
    if (state.ui.offline) { state.ui.offline = false; render(); }
  } catch (error) {
    if (!error.serverGone) toast(`Cannot reach the agent: ${error.message}`, true);
    else if (!state.ui.offline) { state.ui.offline = true; render(); }
  }
  setTimeout(poll, POLL_MS);
}

async function boot() {
  try {
    const [review, reviewer] = await Promise.all([transport.loadReview(), transport.loadReviewer()]);
    setReview(review);
    state.reviewer = { ...emptyReviewer(), ...reviewer };
    state.seen = new Set(state.reviewer.seen);
    applyTheme();
    noteFreshHunks();
    importOwnReview();
    startRoundOnNewCommits();
    applySummaryDraft();
    // Comments that were there when the review first opened are not new.
    state.reviewer.knownComments ??= (review.reviewComments || []).map((comment) => comment.id);
    saveReviewer();
    const first = lines()[0];
    const index = first.stops.findIndex((stop) => !isSeen(stop.hunkId));
    state.view = { kind: 'station', line: first.id, index: index === -1 ? 0 : index };
    setTimeout(poll, POLL_MS);
    checkGitHub();
    if (!restorePosition()) state.view = { kind: 'home' };
    render();
    // The switch is optional, so the page does not wait for the list.
    loadReviews().then(render);
  } catch (error) {
    const app = document.getElementById('app');
    app.className = 'boot error';
    app.textContent = `The review data did not load: ${error.message}. Check that the agent is still running and reload this page.`;
  }
}

systemDark.addEventListener('change', applyTheme);

document.addEventListener('change', (event) => {
  const id = event.target.dataset?.findingSeverity;
  if (!id) return;
  const finding = state.review.findings.find((candidate) => candidate.id === id);
  if (event.target.value === finding?.severity) delete state.reviewer.severities[id];
  else state.reviewer.severities[id] = event.target.value;
  saveReviewer();
  render();
});
applyTheme();

// An avatar that does not load is left out.
document.addEventListener('error', (event) => { if (event.target.matches?.('img.avatar')) event.target.remove(); }, true);

// The libraries load after this script; one render shows whatever arrived together.
for (const script of document.querySelectorAll('script[data-library]')) script.addEventListener('load', renderSoon);

boot();
</script>
</body>
</html>
