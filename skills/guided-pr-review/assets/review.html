    ${stop.why ? `<p class="why"><b>Why here:</b> ${inlineMarkup(stop.why)}</p>` : ''}
    <div class="explain">
      ${hunk.explanation ? `<p>${inlineMarkup(hunk.explanation)}</p>` : ''}
      ${hunk.explanationMore ? `<details class="explain-more"${state.ui.openExplain.has(hunk.id) ? ' open' : ''} data-explain-for="${hunk.id}"><summary>${ICONS.ask}Longer explanation from the AI</summary><div class="explain-more-body">${markdownHtml(hunk.explanationMore)}</div></details>`
        : explainPending ? `<span class="pending">The AI is writing a longer explanation…</span>`
        : `<button class="btn btn-quiet icon-button" data-action="explain" data-hunk="${hunk.id}" title="Ask the AI for a longer explanation of this hunk">${ICONS.ask}Explain more</button>`}
    </div>
    </section>
    ${renderDiff(hunk, findings, remarks)}
    ${renderAdvice(hunk, findings)}
    ${renderAsk(hunk)}
    <div class="station-nav">
      <button class="btn btn-outline-go" data-action="prev"${line === lines()[0] && state.view.index === 0 ? ' disabled' : ''}>Previous hunk</button>
      ${verdictButtons(hunk)}
    </div>
  </article>`;
}

function diffRows(hunk) {
  const rows = [];
  let oldLine = hunk.oldStart || 0;
  let newLine = hunk.newStart || 0;
  for (const text of hunk.lines) {
    const sign = text[0];
    if (sign === '\\') { rows.push({ kind: 'meta', text: text.slice(2) }); continue; }
    // A hunk joined from several (--whole) keeps the header of each part; the lines between them did not change.
    const gap = text.startsWith('@@') && text.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)/);
    if (gap) {
      oldLine = Number(gap[1]);
      newLine = Number(gap[2]);
      rows.push({ kind: 'meta', gap: true, text: `⋯ unchanged lines skipped, continues at line ${newLine}` });
      continue;
    }
    if (sign === '+') rows.push({ kind: 'add', newNo: newLine++, text: text.slice(1) });
    else if (sign === '-') rows.push({ kind: 'del', oldNo: oldLine++, text: text.slice(1) });
    else rows.push({ kind: 'ctx', oldNo: oldLine++, newNo: newLine++, text: text.slice(1) });
  }
  return rows;
}

const LANGUAGE_BY_EXTENSION = { js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript', ts: 'typescript', tsx: 'typescript', vue: 'xml', html: 'xml', phtml: 'xml', yml: 'yaml', md: 'markdown', sh: 'bash', py: 'python', rb: 'ruby' };

function extensionOf(path) { return path.split('.').pop().toLowerCase(); }

function languageOf(path) {
  const extension = extensionOf(path);
  const language = LANGUAGE_BY_EXTENSION[extension] || extension;
  return window.hljs && window.hljs.getLanguage(language) ? language : null;
}

// Lines are highlighted one by one, so a construct over several lines (a docblock) only keeps colour where a line shows it.
function codeHtml(text, language) {
  if (!text) return ' ';
  return language ? window.hljs.highlight(text, { language, ignoreIllegals: true }).value : escapeHtml(text);
}

// Each side of the hunk is highlighted as one text, so a line inside a multi-line comment or string keeps that context.
// Context lines take the new side; removed lines the old side. Each hunk is highlighted once.
function highlightedLines(hunk, rows) {
  const language = languageOf(hunk.file);
  const key = `${hunk.id}:${language}`;
  if (state.rowHtml.has(key)) return state.rowHtml.get(key);
  const html = rows.map(() => '');
  for (const side of ['old', 'new']) {
    const sideRows = rows.map((row, index) => ({ row, index })).filter(({ row }) => row.kind !== 'meta' && row.kind !== (side === 'old' ? 'add' : 'del'));
    const lines = splitHighlighted(codeHtml(sideRows.map(({ row }) => row.text).join('\n'), language));
    sideRows.forEach(({ row, index }, at) => {
      if (side === 'new' || row.kind === 'del') html[index] = lines[at] || ' ';
    });
  }
  state.rowHtml.set(key, html);
  return html;
}

// Split highlighted HTML at line breaks, closing the spans that are open at the end of a line and opening them again on the next.
function splitHighlighted(html) {
  const lines = [];
  const open = [];
  let current = '';
  for (const part of html.split(/(<span[^>]*>|<\/span>|\n)/)) {
    if (part === '\n') {
      lines.push(current + '</span>'.repeat(open.length));
      current = open.join('');
    } else {
      if (part.startsWith('<span')) open.push(part);
      else if (part === '</span>') open.pop();
      current += part;
    }
  }
  lines.push(current + '</span>'.repeat(open.length));
  return lines;
}

function rowLocation(row) {
  const side = row.kind === 'del' ? 'LEFT' : 'RIGHT';
  return { side, line: side === 'LEFT' ? row.oldNo : row.newNo };
}

function lineLabel(item) {
  return item.startLine && (item.startLine !== item.line || item.startSide !== item.side) ? `lines ${item.startLine}–${item.line}` : `line ${item.line}`;
}

// A range keeps GitHub's shape: start_line/start_side for the first selected row, line/side for the last.
function composerFor(hunk, fromIndex, toIndex) {
  const rows = diffRows(hunk);
  let [from, to] = fromIndex <= toIndex ? [fromIndex, toIndex] : [toIndex, fromIndex];
  // GitHub only accepts a range inside one part of the diff, so a range stops at a gap of skipped lines.
  const gap = rows.slice(from, to).findLastIndex((row) => row.gap);
  if (gap !== -1) from += gap + 1;
  const [first, last] = [rows[from], rows[to]];
  const start = rowLocation(first);
  const end = rowLocation(last);
  return { hunkId: hunk.id, startLine: start.line, startSide: start.side, line: end.line, side: end.side };
}

// A hunk without line changes (a rename or a binary file) has no line to attach a remark to.
function wholeHunkComposer(hunk) {
  const changed = diffRows(hunk).map((row, index) => (row.kind === 'add' || row.kind === 'del' ? index : -1)).filter((index) => index !== -1);
  return changed.length ? composerFor(hunk, changed[0], changed[changed.length - 1]) : null;
}

function rowIndexOf(rows, line, side) {
  return rows.findIndex((row) => row.kind !== 'meta' && rowLocation(row).line === line && rowLocation(row).side === side);
}

function rowMatches(row, item) {
  if (item.side === 'LEFT') return row.oldNo === item.line && row.kind !== 'add';
  return row.newNo === item.line && row.kind !== 'del';
}

// The advice follows from the findings and the repo's own severity cutoff, so it never contradicts them.
function renderAdvice(hunk, findings) {
  const threshold = severityRank(state.review.conventions.requestChangesFrom || 'minor');
  const open = findings.filter((finding) => decisionOf(finding) !== 'dismissed');
  const blocking = open.filter((finding) => severityRank(findingSeverity(finding)) >= threshold);
  const count = (list) => `${list.length} ${list.length === 1 ? 'finding' : 'findings'}`;
  const advice = blocking.length
    ? { kind: 'changes', title: 'Request changes', text: `${count(blocking)} at ${escapeHtml(state.review.conventions.requestChangesFrom || 'minor')} or higher.` }
    : open.length
      ? { kind: 'feedback', title: 'Leave feedback', text: `${count(open)} below the request-changes level.` }
      : { kind: 'ok', title: 'Looks good', text: 'The AI found nothing to change in this hunk.' };
  const rows = diffRows(hunk);
  const firstRow = rows.find((row) => row.kind === 'add' || row.kind === 'del') || rows.find((row) => row.kind !== 'meta');
  const button = firstRow
    ? `<button class="btn" data-select-hunk="${hunk.id}">Add a remark on this hunk</button><span class="advice-hint">or drag over line numbers to comment on those lines</span>`
    : '';
  return `<div class="advice ${advice.kind}"><p><strong>AI recommendation: ${advice.title}.</strong> ${advice.text}</p><div class="advice-actions">${button}</div></div>`;
}

// Choosing a verdict is how the reviewer moves on, so every hunk gets one on purpose.
function suggestedVerdict(hunk) { return verdictFromSeverities(standingSeverities(hunk.id)); }

const POSTED_HUNK_VERDICTS = { approved: 'You approved this hunk', changes: 'You requested changes', comment: 'You commented' };

function verdictButtons(hunk) {
  const mine = verdictOf(hunk.id);
  if (postedReview()) return `<span class="verdict-posted">${mine ? `${VERDICT_ICONS[mine]}${POSTED_HUNK_VERDICTS[mine]}` : 'No verdict on this hunk'} · review posted</span>`;
  const suggested = suggestedVerdict(hunk);
  const button = (verdict, label) => `<button class="btn verdict-${verdict}${mine === verdict ? ' on' : ''}${verdict === suggested ? ' suggested' : ' muted'}" data-hunk-verdict="${verdict}" data-hunk="${hunk.id}" aria-pressed="${mine === verdict}" title="${verdict === suggested ? 'Suggested for this hunk. ' : ''}${label} and go to the next hunk. Local only: GitHub has no per-hunk verdict.">${VERDICT_ICONS[verdict]}${label}${verdict === suggested ? '<span class="sr"> (suggested)</span>' : ''}</button>`;
  return `<span class="verdict-buttons" role="group" aria-label="Your verdict on this hunk. Local only: GitHub has no per-hunk verdict.">${button('approved', 'Approve')}${button('changes', 'Request changes')}${button('comment', 'Comment')}</span>`;
}

// Symfony documents the phpstorm:// scheme. No other JetBrains editor has a documented scheme.
const PHPSTORM_EXTENSIONS = ['php', 'phtml'];
const ON_MAC = /Mac/.test(navigator.userAgentData?.platform || navigator.platform);

function firstChangedLine(hunk) {
  return diffRows(hunk).find((row) => row.kind === 'add')?.newNo || hunk.newStart;
}

function fileKept(hunk) { return hunk.status !== 'removed' && !hunk.binary; }

// "Whole file" needs a file source: the HTTP server has one, a hosted page only when its transport adds loadFile.
function fileTools(hunk) {
  const whole = fileKept(hunk) && transport.loadFile ? `<button class="file-tool" data-action="whole-file" data-hunk="${hunk.id}" title="Show the whole file with the changes marked">${ICONS.file}Whole file</button>` : '';
  const tools = whole + editorTools(hunk);
  return tools ? `<span class="file-tools">${tools}</span>` : '';
}

// The editor links and the folder button need the local clone, which the agent names in pr.localPath.
function editorTools(hunk) {
  const tools = [];
  const root = state.review.pr.localPath;
  if (root && fileKept(hunk)) {
    const full = `${root.replace(/[\\/]$/, '')}/${hunk.file}`;
    const line = firstChangedLine(hunk);
    tools.push(`<a class="file-tool" href="vscode://file${encodeURI(full.startsWith('/') ? full : `/${full}`)}:${line}" title="Open in VS Code at line ${line}">${ICONS.editor}VS Code</a>`);
    if (PHPSTORM_EXTENSIONS.includes(extensionOf(hunk.file))) tools.push(`<a class="file-tool" href="phpstorm://open?file=${encodeURIComponent(full)}&amp;line=${line}" title="Open in PhpStorm at line ${line}">${ICONS.editor}PhpStorm</a>`);
    if (transport.openFolder) tools.push(`<button class="file-tool" data-action="open-folder" data-file="${escapeHtml(hunk.file)}" title="Show the file in its folder">${ICONS.folder}${ON_MAC ? 'Show in Finder' : 'Open folder'}</button>`);
  }
  return tools.join('');
}

// The whole file at the head of the pull request. Every hunk of the file marks its added lines,
// and puts its removed lines back where they were.
async function showWholeFile(hunk) {
  let text;
  try {
    text = await transport.loadFile(hunk.file);
  } catch (error) {
    return toast(`Cannot show ${hunk.file}: ${error.message}`, true);
  }
  const added = new Set();
  const removedBefore = new Map();
  for (const other of state.review.hunks.filter((candidate) => candidate.file === hunk.file && candidate.lines.length)) {
    const rows = diffRows(other);
    const html = highlightedLines(other, rows);
    // A hunk without new lines starts at the line before the removal.
    let next = other.newLines === 0 ? other.newStart + 1 : other.newStart;
    rows.forEach((row, index) => {
      if (row.kind === 'add') added.add(row.newNo);
      if (row.newNo) next = row.newNo + 1;
      if (row.kind === 'del') removedBefore.set(next, [...(removedBefore.get(next) || []), html[index]]);
    });
  }
  const sign = { add: '+', del: '−', ctx: ' ' };
  const row = (kind, number, html) => `<tr class="${kind}"${number ? ` data-line="${number}"` : ''}><td class="num">${number || ''}</td><td class="sign">${sign[kind]}</td><td class="code">${html || ' '}</td></tr>`;
  const removed = (number) => (removedBefore.get(number) || []).map((html) => row('del', null, html)).join('');
  const lines = splitHighlighted(codeHtml(text.replace(/\n$/, ''), languageOf(hunk.file)));
  const body = lines.map((html, index) => removed(index + 1) + row(added.has(index + 1) ? 'add' : 'ctx', index + 1, html)).join('') + removed(lines.length + 1);
  const dialog = document.getElementById('file-view');
  dialog.querySelector('h2').textContent = hunk.file;
  dialog.querySelector('.file-tools').innerHTML = editorTools(hunk);
  dialog.querySelector('tbody').innerHTML = body;
  dialog.showModal();
  const target = dialog.querySelector(`tr[data-line="${firstChangedLine(hunk)}"]`);
  target?.classList.add('focus');
  target?.scrollIntoView({ block: 'center' });
}

function renderDiff(hunk, findings, remarks) {
  // Like GitHub: the count of added and removed lines, with the line ranges in the tooltip.
  const rows = hunk.lines.length ? diffRows(hunk) : [];
  const added = rows.filter((row) => row.kind === 'add').length;
  const removed = rows.filter((row) => row.kind === 'del').length;
  const range = (start, count) => (count ? `lines ${start}–${start + count - 1}` : 'none');
  const ranges = `In this hunk: ${added} added and ${removed} removed. Old file: ${range(hunk.oldStart || 0, hunk.oldLines || 0)}. New file: ${range(hunk.newStart || 0, hunk.newLines || 0)}.`;
  const stat = rows.length ? `<span class="diff-stat" title="${ranges}"><span class="diff-added" aria-hidden="true">+${added}</span> <span class="diff-removed" aria-hidden="true">−${removed}</span><span class="sr">${ranges}</span></span>` : '';
  const head = `<div class="diff-head"><span class="diff-head-name">${escapeHtml(hunk.file)}</span>${fileTools(hunk)}${stat}</div>`;
  const posted = (state.review.ownRemarks || []).filter((own) => own.state === 'posted' && own.hunkId === hunk.id);
  const notes = [...reviewCommentsOn(hunk.id).map((comment) => ({ type: 'comment', item: comment })), ...findings.map((finding) => ({ type: 'finding', item: finding })), ...remarks.map((remark) => ({ type: 'remark', item: remark })), ...posted.map((own) => ({ type: 'posted', item: own }))];
  if (hunk.lines.length === 0) {
    const reason = hunk.binary ? 'This is a binary file. Open it on GitHub to compare.' : `No line changes: the file is ${escapeHtml(hunk.status)}.`;
    return `<section class="diff" aria-label="Diff">${head}<p class="diff-empty">${reason}</p>${notes.map(renderNote).join('')}</section>`;
  }
  const code = highlightedLines(hunk, rows);
  const placed = new Set();
  const composer = state.ui.composer && state.ui.composer.hunkId === hunk.id ? state.ui.composer : null;
  const selected = composer ? [rowIndexOf(rows, composer.startLine ?? composer.line, composer.startSide ?? composer.side), rowIndexOf(rows, composer.line, composer.side)].sort((a, b) => a - b) : null;
  // Every line a note covers is marked; the reviewer's own remarks get the stronger mark.
  const marks = new Map();
  for (const note of notes) {
    if (!note.item.line) continue;
    const end = rows.findIndex((row) => rowMatches(row, note.item));
    const start = note.item.startLine ? rows.findIndex((row) => rowMatches(row, { line: note.item.startLine, side: note.item.startSide || note.item.side })) : end;
    if (end === -1) continue;
    const mine = note.type === 'remark' || note.type === 'posted';
    for (let index = Math.max(0, Math.min(start, end)); index <= end; index++) if (mine || !marks.has(index)) marks.set(index, mine ? 'noted-mine' : 'noted');
  }
  const body = rows.map((row, index) => {
    if (row.kind === 'meta') return `<tr><td class="num"></td><td class="num"></td><td class="sign"></td><td class="code meta">${escapeHtml(row.text)}</td></tr>`;
    const { side, line: lineNo } = rowLocation(row);
    const attached = notes.filter((note) => !placed.has(note) && note.item.line && rowMatches(row, note.item));
    attached.forEach((note) => placed.add(note));
    const sign = row.kind === 'add' ? '+' : row.kind === 'del' ? '−' : ' ';
    const button = `<button data-remark="${hunk.id}" data-row="${index}" aria-label="Write a remark on line ${lineNo}">${lineNo}</button>`;
    const isSelected = selected && index >= selected[0] && index <= selected[1];
    let html = `<tr class="${row.kind}${isSelected ? ' selected' : ''}${marks.has(index) ? ` ${marks.get(index)}` : ''}" data-hunk-row="${hunk.id}" data-row="${index}">
      <td class="num">${row.oldNo ? (side === 'LEFT' ? button : row.oldNo) : ''}</td>
      <td class="num">${row.newNo ? (side === 'RIGHT' ? button : row.newNo) : ''}</td>
      <td class="sign"><button class="add-line" data-remark="${hunk.id}" data-row="${index}" aria-label="Add a remark on line ${lineNo}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>${sign}</td><td class="code">${code[index]}</td></tr>`;
    for (const note of attached) html += `<tr class="note"><td colspan="4">${renderNote(note)}</td></tr>`;
    if (composer && composer.line === lineNo && composer.side === side) html += `<tr class="note"><td colspan="4">${renderComposer(composer)}</td></tr>`;
    return html;
  }).join('');
  const loose = notes.filter((note) => !placed.has(note));
  return `<section class="diff" aria-label="Diff">${head}
    ${loose.length ? loose.map(renderNote).join('') : ''}
    <div class="diff-wrap" tabindex="0" role="region" aria-label="Diff of ${escapeHtml(hunk.file)}"><table class="diff-table"><tbody>${body}</tbody></table></div>
  </section>`;
}

function renderNote(note) {
  if (note.type === 'comment') {
    const comment = note.item;
    const author = comment.url ? `<a href="${escapeHtml(comment.url)}" target="_blank" rel="noopener">@${escapeHtml(comment.author)}</a>` : `@${escapeHtml(comment.author)}`;
    return `<div class="note-block review-comment">
      <div class="note-head">${avatar(comment.author)}<span class="who"><b>${author}</b> commented${comment.line ? ` on ${lineLabel(comment)}` : ''} · not your remark, not posted again</span></div>
      ${comment.replies?.length ? conversationHtml(comment) : `<div class="note-body markdown">${markdownHtml(comment.body)}</div>`}
      ${fixLine(comment)}${opinionLine(comment.opinion)}
      <div class="note-actions">${copyButton(comment)}</div>
    </div>`;
  }
  if (note.type === 'finding') {
    const finding = note.item;
    const decision = decisionOf(finding);
    const editing = state.ui.editing === finding.id;
    const text = findingText(finding);
    return `<div class="note-block ${decision}">
      <div class="note-head"><span class="note-title">${inlineMarkup(finding.title)}</span>${severitySelect(finding)}${aiTag('AI finding')}${finding.rule ? `<span class="who nowrap">${escapeHtml(finding.rule)}</span>` : ''}
        ${decision !== 'open' ? `<span class="state-tag ${decision}">${decision === 'accepted' ? 'Accepted' : 'Dismissed'}</span>` : ''}${decision === 'accepted' ? statusBadge(finding.id, text) : ''}</div>
      ${editing ? `<div class="composer"><textarea id="edit-${finding.id}" data-edit="${finding.id}" aria-label="Edit the finding text">${escapeHtml(state.ui.drafts[`edit:${finding.id}`] ?? text)}</textarea>
          <div class="composer-row"><button class="btn btn-ink" data-save-edit="${finding.id}">Save text</button><button class="btn btn-quiet" data-cancel-edit="${finding.id}">Cancel</button></div></div>`
        : `<p class="note-body">${inlineMarkup(text)}</p>`}
      ${editing ? '' : `<div class="note-actions">
        ${decision !== 'accepted' ? `<button class="btn btn-outline-ok" data-decide="${finding.id}" data-decision="accepted">Accept</button>` : ''}
        ${decision !== 'dismissed' ? `<button class="btn btn-quiet" data-decide="${finding.id}" data-decision="dismissed">Dismiss</button>` : ''}
        ${decision !== 'open' ? `<button class="btn btn-quiet" data-decide="${finding.id}" data-decision="open">Undo</button>` : ''}
        <button class="btn btn-quiet" data-start-edit="${finding.id}">Edit text</button>
      </div>`}
    </div>`;
  }
  const remark = note.item;
  const own = ownRemark(remark.id);
  if (note.type === 'posted') {
    return `<div class="note-block">
      <div class="note-head">${avatar(viewerLogin())}<span class="sev ${severityClass(remark.severity)}">${escapeHtml(remark.severity)}</span><span class="who">You posted this earlier${remark.url ? ` · <a href="${escapeHtml(remark.url)}" target="_blank" rel="noopener">open on GitHub</a>` : ''}. It is not posted again.</span></div>
      ${remark.replies?.length ? conversationHtml(remark) : `<p class="note-body">${inlineMarkup(remark.body)}</p>`}${fixLine(remark)}${threadActions(remark)}
    </div>`;
  }
  const editing = state.ui.editing === remark.id;
  const options = severities().map((severity) => `<option${severity === remark.severity ? ' selected' : ''}>${escapeHtml(severity)}</option>`).join('');
  return `<div class="note-block accepted">
    <div class="note-head">${avatar(viewerLogin())}<span class="sev ${severityClass(remark.severity)}">${escapeHtml(remark.severity)}</span><span class="who">${own ? 'Your pending remark from GitHub' : 'Your remark'}${remark.line ? ` · ${lineLabel(remark)}` : ''}</span>${statusBadge(remark.id, remark.body)}</div>
    ${editing ? `<div class="composer"><textarea id="edit-${remark.id}" data-edit="${remark.id}" aria-label="Edit your remark">${escapeHtml(state.ui.drafts[`edit:${remark.id}`] ?? remark.body)}</textarea>
        <div class="composer-row"><label>Severity <select id="edit-severity-${remark.id}">${options}</select></label><button class="btn btn-ink" data-save-remark="${remark.id}">Save remark</button><button class="btn btn-quiet" data-cancel-edit="${remark.id}">Cancel</button></div></div>`
      : `<p class="note-body">${inlineMarkup(remark.body)}</p>
    <div class="note-actions"><button class="btn btn-quiet" data-start-edit="${remark.id}">Edit</button><button class="btn btn-quiet danger-text" data-delete-remark="${remark.id}">Delete</button></div>`}
  </div>`;
}

const REVIEW_STATES = {
  APPROVED: { label: 'approved', icon: 'approved' },
  CHANGES_REQUESTED: { label: 'requested changes', icon: 'changes' },
  COMMENTED: { label: 'commented', icon: 'comment' },
  DISMISSED: { label: 'review dismissed', icon: 'comment' },
};
const FIX_LABELS = { fixed: 'Looks fixed', 'not-fixed': 'Not fixed', unclear: 'Unclear' };

function renderReviews() {
  const reviews = [...(state.review.reviews || [])].sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''));
  const mine = reviews.filter((review) => review.author === viewerLogin());
  const others = reviews.filter((review) => review.author !== viewerLogin());
  return `<section class="terminus reviews-view">
    ${reviews.length ? '' : '<p class="lede">Nobody has reviewed this PR yet.</p>'}
    ${mine.length ? `<div class="check-group"><h2>Your reviews</h2>${mine.map((review, index) => reviewCard(review, index === 0)).join('')}</div>` : ''}
    ${others.length ? `<div class="check-group"><h2>Other reviewers</h2>${others.map((review) => reviewCard(review, false)).join('')}</div>` : ''}
  </section>`;
}

// The reviewer's newest review is their current one: it holds the update. Their older ones and approvals are closed.
function reviewCard(review, current) {
  const kind = REVIEW_STATES[review.state] || REVIEW_STATES.COMMENTED;
  const mine = review.author === viewerLogin();
  const comments = mine ? postedOwnRemarks().filter((own) => own.reviewId === review.id) : (state.review.reviewComments || []).filter((comment) => comment.reviewId === review.id);
  const toCheck = mine ? comments.filter((own) => own.threadId && !own.resolved && !threadCall(own)).length : 0;
  const key = `review-${review.id}`;
  // After an update, the comments still open sit in an older review; that review stays open so they are in reach.
  const open = state.ui.terminusOpen?.[key] ?? (current || (mine ? toCheck > 0 : review.state !== 'APPROVED'));
  return `<details class="review-card" data-term-section="${key}"${open ? ' open' : ''}>
    <summary class="review-head">${avatar(review.author)}<b>${mine ? 'You' : `@${escapeHtml(review.author)}`}</b>${current ? '<span class="state-tag">current</span>' : ''}
      <span class="review-state ${kind.icon}">${VERDICT_ICONS[kind.icon]}${kind.label}</span>
      ${review.submittedAt ? `<span class="muted">${escapeHtml(timeLabel(review.submittedAt))}</span>` : ''}
      <span class="term-counts">${plural(comments.length, 'comment')}${toCheck ? ` · ${toCheck} to check` : ''}</span></summary>
    <div class="review-body">
      ${review.body ? `<div class="markdown">${markdownHtml(review.body)}</div>` : ''}
      ${review.url ? `<p><a href="${escapeHtml(review.url)}" target="_blank" rel="noopener">Open on GitHub</a></p>` : ''}
      ${comments.map((comment) => renderThread(comment, mine)).join('')}
      ${current ? updateFooter(review) : ''}
    </div>
  </details>`;
}

function renderThread(comment, mine) {
  const at = comment.hunkId && firstStationOf(comment.hunkId);
  const head = `<span class="thread-loc">${threadPlace(comment)}</span>${comment.outdated ? '<span class="muted">outdated</span>' : ''}
    ${at ? stationButton(at.line, at.index, 'Show in flow', { title: 'Open this hunk in its flow' }) : ''}`;
  const body = `${threadCode(comment)}
    ${conversationHtml(comment)}
    ${mine ? `${fixLine(comment)}${threadActions(comment)}` : `${comment.resolved ? '' : fixLine(comment) + opinionLine(comment.opinion)}<div class="note-actions">${copyButton(comment)}</div>`}`;
  if (comment.resolved) return `<details class="thread resolved"><summary class="thread-head">${head}<span class="state-tag">Resolved</span></summary>${body}</details>`;
  return `<div class="thread"><div class="thread-head">${head}</div>${body}</div>`;
}

// GitHub's diff hunk ends at the commented line, so its last lines show the code the comment is about.
function threadCode(comment) {
  if (!comment.diffHunk) return '';
  const [header, ...lines] = comment.diffHunk.split('\n');
  const [, oldStart, newStart] = header.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)/);
  const rows = diffRows({ lines, oldStart: Number(oldStart), newStart: Number(newStart) }).filter((row) => row.kind !== 'meta').slice(-4);
  const language = languageOf(comment.path || hunkById(comment.hunkId)?.file || '');
  const sign = { add: '+', del: '−', ctx: ' ' };
  const body = rows.map((row) => `<tr class="${row.kind}"><td class="num">${(row.kind === 'del' || (row.kind === 'ctx' && comment.side === 'LEFT') ? row.oldNo : row.newNo) || ''}</td><td class="sign">${sign[row.kind]}</td><td class="code">${codeHtml(row.text, language)}</td></tr>`).join('');
  return `<div class="thread-code"><table class="diff-table" aria-label="The commented line is the last one"><tbody>${body}</tbody></table></div>`;
}

function conversationHtml(comment) {
  const entries = [{ author: comment.author || viewerLogin(), body: comment.body }, ...(comment.replies || [])];
  return `<ol class="conversation">${entries.map((entry, index) => `<li>${avatar(entry.author)}<div class="conversation-entry"><span class="who"><b>@${escapeHtml(entry.author)}</b>${index ? ' replied' : ''}${entry.at ? ` · ${escapeHtml(timeLabel(entry.at))}` : ''}</span><div class="markdown">${markdownHtml(entry.body)}</div></div></li>`).join('')}</ol>`;
}

function fixLine(own) {
  if (!own.fix || own.resolved) return '';
  return `<p class="fix ${own.fix.verdict}">${aiTag('AI check')}<b>${FIX_LABELS[own.fix.verdict] || 'Unclear'}.</b> ${inlineMarkup(own.fix.note || '')}</p>`;
}

// Resolve or leave open. The AI's recommendation is the stronger button; a thread left open can get a reply.
function threadActions(own) {
  if (!own.threadId || own.resolved) return own.resolved ? '<p class="who">Resolved on GitHub.</p>' : '';
  const call = threadCall(own);
  const suggested = own.fix?.verdict === 'fixed' ? 'resolve' : own.fix?.verdict === 'not-fixed' ? 'open' : null;
  const button = (value, label, kind) => `<button class="btn verdict-${kind}${call === value ? ' on' : ''}${suggested && value !== suggested ? ' muted' : ''}" data-thread-call="${value}" data-thread="${escapeHtml(own.threadId)}" aria-pressed="${call === value}">${VERDICT_ICONS[kind]}${label}</button>`;
  const reply = call === 'open' ? `<div class="composer thread-reply"><textarea data-thread-reply="${escapeHtml(own.threadId)}" aria-label="Reply in this thread" placeholder="Optional: what is still missing?">${escapeHtml(state.reviewer.threadReplies[own.threadId] ?? '')}</textarea>
      <p class="who">Posted as a reply in the thread when you post the review. Leave it empty for no reply.${own.fix?.reply ? ' The text starts as the AI draft.' : ''}</p></div>` : '';
  return `<div class="verdict-buttons thread-calls" role="group" aria-label="Your call on this comment">
      ${own.canResolve === false ? '' : button('resolve', 'Resolve', 'approved')}${button('open', 'Leave open', 'changes')}</div>${reply}`;
}

function copyButton(comment) {
  const copied = state.reviewer.remarks.some((remark) => remark.copiedFrom === comment.id) || (state.reviewer.copiedToSummary || []).includes(comment.id);
  return copied ? '<span class="who">Copied to your review</span>' : `<button class="btn btn-quiet" data-copy-comment="${escapeHtml(comment.id)}">Copy to my review</button>`;
}

// A colleague's comment becomes a remark of the reviewer on the same lines, or part of the review body when those lines are gone.
function copyComment(comment) {
  const text = `> @${comment.author}: ${comment.body.replace(/\n/g, '\n> ')}\n\n`;
  const hunk = comment.hunkId && hunkById(comment.hunkId);
  const at = hunk && comment.line && diffRows(hunk).some((row) => rowMatches(row, comment)) && firstStationOf(hunk.id);
  if (at) {
    go(at.line.id, at.index);
    // A copy starts at the lowest severity, so copying a question never raises the proposed verdict by itself.
    return openComposer({ hunkId: hunk.id, startLine: comment.startLine ?? comment.line, startSide: comment.startSide ?? comment.side, line: comment.line, side: comment.side, text, copiedFrom: comment.id, severity: severities()[0] });
  }
  state.reviewer.summary = [state.reviewer.summary.trim(), text.trim()].filter(Boolean).join('\n\n');
  state.reviewer.copiedToSummary = [...(state.reviewer.copiedToSummary || []), comment.id];
  saveReviewer();
  goTerminus();
  toast('Added to your review summary. Edit it there.');
}

function renderComposer(composer) {
  const key = `remark:${composer.hunkId}:${composer.startLine}:${composer.line}:${composer.side}`;
  const options = severities().map((severity) => `<option${severity === (composer.severity || severities()[1] || severities()[0]) ? ' selected' : ''}>${escapeHtml(severity)}</option>`).join('');
  return `<div class="note-block composer">
    <div class="note-head">${avatar(viewerLogin())}<span class="who">Your remark on ${lineLabel(composer)}</span></div>
    <textarea id="composer" data-draft="${escapeHtml(key)}" aria-label="Remark text" placeholder="What should the author know or change?">${escapeHtml(state.ui.drafts[key] ?? composer.text ?? '')}</textarea>
    <div class="composer-row">
      <label>Severity <select id="composer-severity">${options}</select></label>
      <button class="btn btn-ink" data-action="save-remark">Add remark</button>
      <button class="btn btn-quiet" data-action="cancel-remark">Cancel</button>
    </div>
  </div>`;
}

function renderAsk(hunk) {
  const qa = sentEvents('ask', hunk.id).map((asked) => {
    const answer = answerFor(asked.id);
    return `<div class="qa"><p class="qa-q">${escapeHtml(asked.question)}</p>
      ${answer ? `<div class="qa-a">${markdownHtml(answer.answer)}</div>
        <div class="note-actions"><button class="btn btn-quiet" data-answer-remark="${escapeHtml(asked.id)}">Turn into a remark</button></div>`
        : `<span class="pending">Waiting for the agent…</span>`}
    </div>`;
  }).join('');
  const key = `ask:${hunk.id}`;
  return `${askFab(hunk)}<section class="ask-panel" id="ask-panel" popover aria-label="Ask the agent about this hunk">
    <div class="ask-panel-scroll">
      <div class="ask-panel-head"><h3>Ask about ${escapeHtml(fileName(hunk.file))}</h3></div>
      ${qa}
      <textarea id="ask-${hunk.id}" data-draft="${escapeHtml(key)}" placeholder="For example: why is the cache keyed by city?" aria-label="Question about this hunk">${escapeHtml(state.ui.drafts[key] || '')}</textarea>
      <div class="composer-row"><button class="btn btn-ink" data-ask="${hunk.id}">Ask</button></div>
    </div>
    <span class="ask-pointer" aria-hidden="true"></span>
  </section>`;
}

// The round button opens the panel as a native popover: the browser handles Esc, a click outside and aria-expanded.
function askFab(hunk, turning = false) {
  const asked = sentEvents('ask', hunk.id);
  const waiting = asked.some((event) => !answerFor(event.id));
  const open = state.ui.askOpen;
  const label = open ? 'Close the questions about this hunk' : 'Ask the agent about this hunk';
  return `<button class="ask-fab${waiting ? ' waiting' : ''}${open ? ' open' : ''}${turning ? ' enter' : ''}" popovertarget="ask-panel" aria-label="${label}" title="${label}">
    ${open ? ICONS.close : ICONS.ask}${asked.length && !open ? `<span class="ask-count">${asked.length}</span>` : ''}</button>`;
}

function flowFindingsPill(line) {
  const hunks = new Set(line.stops.map((stop) => stop.hunkId));
  const open = state.review.findings.filter((finding) => hunks.has(finding.hunkId) && decisionOf(finding) === 'open');
  return open.length ? pill(severityTone(worstOf(open).severity), plural(open.length, 'finding')) : '';
}

function renderFlowsOverview() {
  const rows = lines().map((line) => {
    const seen = line.stops.filter((stop) => isSeen(stop.hunkId)).length;
    return `<li>
      <button class="flow-row" data-line="${escapeHtml(line.id)}" style="--line: var(${line.color})">
        ${bullet(line, line.id === '__none' || line.id === '__files')}
        <span class="flow-row-main"><b>${flowIcon(line)}${escapeHtml(line.name)}</b>${line.explanation ? `<span class="flow-row-text" title="${escapeHtml(line.explanation)}">${inlineMarkup(line.explanation)}</span>` : ''}</span>
        <span class="flow-row-side">${flowFindingsPill(line)}${flowVerdictBadge(line)}<span class="rail-count">${seen}/${line.stops.length} seen</span></span>
      </button>
    </li>`;
  }).join('');
  return `<div class="home-group"><h3 class="home-group-title">Flows ${aiTag('grouped and explained by AI')}</h3><ul class="flow-rows">${rows}</ul></div>`;
}

const SEVERITY_TONES = ['info', 'info', 'warn', 'bad'];
function severityTone(severity) { return SEVERITY_TONES[severityLevel(severity)]; }
function strokeIcon(paths, { circle = false } = {}) {
  const stroke = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  return `<svg viewBox="0 0 16 16" aria-hidden="true">${circle ? `<circle cx="8" cy="8" r="6.25" ${stroke}/>` : ''}${paths.map((d) => `<path d="${d}" ${stroke}/>`).join('')}</svg>`;
}

const STATUS_ICONS = {
  ok: strokeIcon(['M5.25 8.2l1.9 1.9 3.6-3.8'], { circle: true }),
  bad: strokeIcon(['M5.75 5.75l4.5 4.5M10.25 5.75l-4.5 4.5'], { circle: true }),
  warn: strokeIcon(['M8 2.25l6.25 11H1.75z', 'M8 6.5v3M8 11.4h.01']),
  finding: strokeIcon(['M8 4.75v3.75M8 11.1h.01'], { circle: true }),
  none: strokeIcon(['M5.25 8h5.5'], { circle: true }),
  coverage: strokeIcon(['M6 1.75h4M6.75 1.75v4.5L2.6 12.9a1 1 0 0 0 .85 1.35h9.1a1 1 0 0 0 .85-1.35L9.25 6.25v-4.5M4.5 10h7']),
  notRead: strokeIcon(['M1.75 8S4 3.75 8 3.75 14.25 8 14.25 8 12 12.25 8 12.25 1.75 8 1.75 8z', 'M9.9 8a1.9 1.9 0 1 1-3.8 0 1.9 1.9 0 0 1 3.8 0z', 'M2.5 13.5l11-11']),
  progress: strokeIcon(['M8 14.25s4.75-4.2 4.75-7.75a4.75 4.75 0 0 0-9.5 0C3.25 10.05 8 14.25 8 14.25z', 'M9.75 6.5a1.75 1.75 0 1 1-3.5 0 1.75 1.75 0 0 1 3.5 0z']),
  link: strokeIcon(['M6.75 9.25a2.75 2.75 0 0 0 3.9 0l2.1-2.1a2.75 2.75 0 0 0-3.9-3.9l-.6.6M9.25 6.75a2.75 2.75 0 0 0-3.9 0l-2.1 2.1a2.75 2.75 0 0 0 3.9 3.9l.6-.6']),
};

function pill(tone, text) { return `<span class="pill tone-${tone}">${text}</span>`; }

function statusPanel({ id, tone, icon, title, tag = '', pills = '', body = '' }) {
  return `<section class="status-panel tone-${tone}" id="${id}">
    <header class="status-head"><span class="status-icon" aria-hidden="true">${icon}</span><h4>${title}</h4>${tag}${pills ? `<span class="status-pills">${pills}</span>` : ''}</header>
    ${body ? `<div class="status-body">${body}</div>` : ''}
  </section>`;
}

function criteriaStatus() {
  const criteria = ticketCriteria();
  const notMet = criteria.filter((criterion) => criterion.verdict === 'not-met').length;
  const open = criteria.filter((criterion) => !['met', 'not-met'].includes(criterion.verdict)).length;
  if (!criteria.length) return { tone: 'quiet', icon: STATUS_ICONS.none, label: 'No acceptance criteria' };
  if (notMet) return { tone: 'bad', icon: STATUS_ICONS.bad, label: `${notMet} of ${plural(criteria.length, 'criterion', 'criteria')} not met` };
  if (open) return { tone: 'warn', icon: STATUS_ICONS.warn, label: `${plural(open, 'criterion', 'criteria')} unclear or not checked` };
  return { tone: 'ok', icon: STATUS_ICONS.ok, label: `All ${plural(criteria.length, 'criterion', 'criteria')} met` };
}

// Findings on hunks that are no longer in the PR do not count.
function liveFindings() { return state.review.findings.filter((finding) => finding.hunkId === null || hunkById(finding.hunkId)); }

function worstOf(findings) { return findings.reduce((worst, finding) => (severityRank(finding.severity) > severityRank(worst.severity) ? finding : worst)); }

function findingsStatus() {
  const open = liveFindings().filter((finding) => decisionOf(finding) === 'open');
  if (!liveFindings().length) return { tone: 'ok', icon: STATUS_ICONS.ok, label: 'No AI findings', open };
  if (!open.length) return { tone: 'ok', icon: STATUS_ICONS.ok, label: 'All AI findings decided', open };
  return { tone: severityTone(worstOf(open).severity), icon: STATUS_ICONS.finding, label: plural(open.length, 'open AI finding'), open };
}

function renderCriteriaPanel() {
  const criteria = ticketCriteria();
  const status = criteriaStatus();
  if (!criteria.length) {
    const reason = state.review.context.tickets?.length ? 'The linked tickets list no acceptance criteria, and the agent could not take any from their descriptions.' : 'No ticket is linked, so there are no acceptance criteria to check.';
    return statusPanel({ id: 'home-criteria', tone: 'quiet', icon: status.icon, title: 'Acceptance criteria', body: `<p class="status-text">${reason}</p>` });
  }
  // Criteria that are not met stay in view; met ones fold away.
  const met = criteria.filter((criterion) => criterion.verdict === 'met');
  const rest = criteria.filter((criterion) => criterion.verdict !== 'met');
  const metFold = met.length ? `<details class="home-fold"${state.ui.openExplain.has('criteria-met') ? ' open' : ''} data-explain-for="criteria-met"><summary>${rest.length ? `Show the ${plural(met.length, 'met criterion', 'met criteria')}` : `Show the ${plural(met.length, 'criterion', 'criteria')}`}</summary><ul class="ac-list">${criteriaRows(met)}</ul></details>` : '';
  return statusPanel({ id: 'home-criteria', tone: status.tone, icon: status.icon, title: 'Acceptance criteria', tag: aiTag('checked by AI'),
    pills: pill(status.tone, status.label),
    body: `${rest.length ? `<ul class="ac-list">${criteriaRows(rest)}</ul>` : ''}${metFold}` });
}

function renderFindingsPanel() {
  const status = findingsStatus();
  if (!liveFindings().length) return '';
  const whole = liveFindings().filter((finding) => finding.hunkId === null);
  const onHunks = liveFindings().length - whole.length;
  const bySeverity = [...severities()].reverse().map((severity) => [severity, status.open.filter((finding) => finding.severity === severity).length]).filter(([, count]) => count);
  return statusPanel({ id: 'home-findings', tone: status.tone, icon: status.icon, title: 'What the AI found', tag: aiTag('AI findings'),
    pills: `${status.open.length ? bySeverity.map(([severity, count]) => pill(severityTone(severity), `${count} ${escapeHtml(severity)}`)).join('') : pill('ok', status.label)}
      ${pill('quiet', `${whole.length} on the whole PR`)}${pill('quiet', `${onHunks} in the flows`)}`,
    body: whole.length ? `<ul class="pr-findings">${whole.map(prFindingRow).join('')}</ul>` : '' });
}

// A whole-PR finding folds to one line, so long findings do not push the flows down.
function prFindingRow(finding) {
  const decision = decisionOf(finding);
  const key = `finding:${finding.id}`;
  return `<li><details${state.ui.openExplain.has(key) ? ' open' : ''} data-explain-for="${escapeHtml(key)}">
    <summary><span class="sev ${severityClass(finding.severity)}">${escapeHtml(finding.severity)}</span><span class="pr-finding-title">${inlineMarkup(finding.title)}</span>${decision !== 'open' ? `<span class="state-tag ${decision}">${decision === 'accepted' ? 'Accepted' : 'Dismissed'}</span>` : ''}</summary>
    <div class="diff">${renderNote({ type: 'finding', item: finding })}</div>
  </details></li>`;
}

function renderHome() {
  const review = state.review;
  const context = review.context;
  const total = review.hunks.length;
  const seen = total - unseenHunks().length;
  const verdicts = Object.values(state.reviewer.hunkVerdicts);
  const count = (verdict) => verdicts.filter((value) => value === verdict).length;
  const items = acceptedItems();
  const onGitHub = items.filter((item) => ['posted', 'draft'].includes(githubStatus(item.id, item.body))).length;
  const proposal = VERDICTS.find((option) => option.id === (state.reviewer.verdict || proposedVerdict()));
  const tickets = (context.tickets || []).map((ticket) => `<li>${referenceAnchor(ticket.key, ticket.url, `${ticket.key}: ${ticket.title}`)} ${escapeHtml(ticket.title)}</li>`).join('');
  const linked = (context.linkedPrs || []).map((pr) => `<li>${githubLink(`${pr.repo}#${pr.number}`, pr.repo, pr.number)} <span class="muted">${escapeHtml(pr.state.toLowerCase())}</span><br>${inlineMarkup(pr.summary || pr.title)}</li>`).join('');
  const general = openReviewComments().filter((comment) => !comment.hunkId || !hunkById(comment.hunkId));
  const skipped = (context.skipped || []).map((text) => `<li>${inlineMarkup(text)}</li>`).join('');
  const relatedCounts = [
    (context.tickets || []).length && plural(context.tickets.length, 'ticket'),
    (context.linkedPrs || []).length && plural(context.linkedPrs.length, 'linked pull request'),
  ].filter(Boolean);
  const criteria = criteriaStatus();
  const findings = findingsStatus();
  const glance = [
    ['home-criteria', criteria.tone, criteria.icon, criteria.label],
    liveFindings().length && ['home-findings', findings.tone, findings.icon, findings.label],
    general.length && ['home-comments', 'warn', VERDICT_ICONS.comment, `${plural(general.length, 'open comment')} outside the diff`],
    skipped && ['home-skipped', 'warn', STATUS_ICONS.notRead, `${context.skipped.length} not read by the AI`],
    ['home-progress', seen === total ? 'ok' : 'info', STATUS_ICONS.progress, `${seen} of ${plural(total, 'hunk')} seen`],
  ].filter(Boolean);
  const proposalTone = { APPROVE: 'ok', REQUEST_CHANGES: 'bad', COMMENT: 'info' }[proposal?.id] || 'quiet';
  return `<section class="home">
    <p class="home-ref"><a href="${escapeHtml(review.pr.url)}" target="_blank" rel="noopener">${escapeHtml(review.pr.owner)}/${escapeHtml(review.pr.repo)}#${review.pr.number}</a></p>
    <h2 class="home-title">${inlineMarkup(review.pr.title)}</h2>
    <p class="home-author">${avatar(review.pr.author)}<span>by <b>${escapeHtml(review.pr.author)}</b></span></p>
    ${context.summary ? `<div class="home-summary">${aiTag('AI summary')}${markdownHtml(context.summary)}</div>` : ''}
    <div class="glance" role="group" aria-label="What to look at first">${glance.map(([target, tone, icon, text]) => `<button class="pill pill-go tone-${tone}" data-scroll-to="${target}">${icon}${text}</button>`).join('')}</div>
    ${review.pr.body ? `<details class="explain-more"${state.ui.openExplain.has('pr-body') ? ' open' : ''} data-explain-for="pr-body"><summary>PR description</summary><div class="explain-more-body">${markdownHtml(review.pr.body)}</div></details>` : ''}

    <div class="home-group"><h3 class="home-group-title">Before you start</h3>
      <div class="status-stack">
        ${renderCriteriaPanel()}
        ${renderFindingsPanel()}
        ${general.length ? statusPanel({ id: 'home-comments', tone: 'warn', icon: VERDICT_ICONS.comment, title: 'Comments outside the diff', pills: pill('warn', `${general.length} open`), body: `<div class="diff">${general.map((comment) => renderNote({ type: 'comment', item: comment })).join('')}</div>` }) : ''}
        ${context.coverage ? statusPanel({ id: 'home-coverage', tone: 'info', icon: STATUS_ICONS.coverage, title: 'Test coverage', tag: aiTag('AI summary'), body: `<p class="status-text">${inlineMarkup(context.coverage.summary)} <span class="muted">Source: ${inlineMarkup(context.coverage.source)}</span></p>` }) : ''}
        ${skipped ? statusPanel({ id: 'home-skipped', tone: 'warn', icon: STATUS_ICONS.notRead, title: 'Not read by the AI', pills: pill('warn', plural(context.skipped.length, 'item')), body: `<ul class="home-list">${skipped}</ul>` }) : ''}
      </div>
      ${tickets || linked ? `<details class="home-fold home-related-fold"${state.ui.openExplain.has('related') ? ' open' : ''} data-explain-for="related"><summary>${STATUS_ICONS.link}${relatedCounts.join(' · ')}</summary><div class="home-related">
        ${tickets ? `<div class="section"><h4>Tickets</h4><ul class="home-list">${tickets}</ul></div>` : ''}
        ${linked ? `<div class="section"><h4>Linked pull requests ${aiTag('AI summaries')}</h4><ul class="home-list">${linked}</ul></div>` : ''}
      </div></details>` : ''}
    </div>

    ${renderFlowsOverview()}

    <div class="home-group home-review" id="home-progress"><h3 class="home-group-title"><span class="status-icon tone-${proposalTone}" aria-hidden="true">${STATUS_ICONS.progress}</span>Your review so far
      ${pill(proposalTone, proposal ? `${VERDICT_ICONS[proposal.icon]}Proposed: ${proposal.label}` : `No proposal yet: ${undecidedLabel()} to decide`)}</h3>
      <div class="status-panel tone-${proposalTone} review-panel">
      <dl class="home-stats">
        <div><dt>Hunks seen</dt><dd>${seen} of ${total}</dd></div>
        <div><dt>Your verdicts per hunk</dt><dd class="counts"><span class="tag-approved">${count('approved')} approved ·</span><span class="tag-changes">${count('changes')} changes requested ·</span><span>${count('comment')} commented</span></dd></div>
        <div><dt>Remarks to post</dt><dd>${items.length ? `${items.length} · ${onGitHub} on GitHub, ${items.length - onGitHub} local only` : 'None'}</dd></div>
      </dl>
      <div class="post-row">
        ${seen < total
          ? `<button class="btn btn-go" data-action="unseen">Continue reviewing</button>
        <button class="btn btn-quiet" data-action="terminus">Submit review…</button>`
          : `<button class="btn btn-go" data-action="terminus">Submit review…</button>
        <button class="btn btn-quiet" data-action="first">Go to the first hunk</button>`}
      </div>
      </div>
    </div>
  </section>`;
}

function threadPlace(item) { return `${escapeHtml(item.path || hunkById(item.hunkId)?.file || '')}${item.line ? ` ${lineLabel(item)}` : ''}`; }

function previewHtml(post) {
  return [
    `<div class="preview-item"><div class="preview-loc">Review body</div>${post.body ? `<div class="preview-text markdown">${markdownHtml(post.body)}</div>` : '<p class="preview-text empty">Empty</p>'}</div>`,
    ...post.comments.map((comment) => `<div class="preview-item"><div class="preview-loc">${escapeHtml(comment.path)} ${comment.start_line ? `lines ${comment.start_line}–${comment.line}` : `line ${comment.line}`}${comment.side === 'LEFT' ? ' (old)' : ''}</div><div class="preview-text markdown">${markdownHtml(comment.body)}</div></div>`),
  ].join('');
}

function postedCard(sent) {
  const option = postedVerdict(sent);
  const url = postFor(sent.id)?.url;
  const counts = sent.payload ? `${sent.payload.body ? 'Review body and ' : ''}${plural(sent.payload.comments.length, 'comment')}` : plural((sent.contents || []).length, 'item');
  return `<div class="posted-card ${option.icon}">
    <span class="posted-icon" aria-hidden="true">${VERDICT_ICONS[option.icon]}</span>
    <div class="posted-text"><h2>${option.done}</h2><p>Posted to GitHub${sent.at ? ` at ${escapeHtml(timeLabel(sent.at))}` : ''} · ${counts}</p></div>
    ${url ? `<a class="btn" href="${escapeHtml(url)}" target="_blank" rel="noopener">View on GitHub</a>` : ''}
  </div>`;
}

function renderPostedTerminus(sent) {
  const finishing = isFinishing();
  // On a merged or closed PR the banner above says what Finish does instead.
  const open = !['merged', 'closed'].includes(state.review.remote?.state);
  return `<section class="terminus">
    ${postedCard(sent)}
    <div class="posted-actions">
      ${!open ? '' : finishing ? '<p class="lede">The agent keeps this review. Run the skill again on this PR for the next round.</p>' : '<button class="btn btn-ink" data-action="finish">Finish for now</button>'}
      <button class="btn" data-action="reviews">See it in Existing reviews</button>
      <button class="btn btn-quiet" data-action="new-round">Start a new review round</button>
    </div>
    ${open ? '<p class="lede">Waiting for the author. New commits start the next round, where you check whether your comments are fixed. Finish for now keeps this review, so that round starts from here.</p>' : ''}
  </section>`;
}

// A draft is a pending review on GitHub: the form stays, with a line that says the draft is there.
function draftLine() {
  const last = sentEvents('post').at(-1);
  const result = last && postFor(last.id);
  if (!last || last.kind !== 'draft' || result?.status !== 'posted') return '';
  return `<p class="draft-line">${VERDICT_ICONS.comment}Draft on GitHub${last.at ? `, updated ${escapeHtml(timeLabel(last.at))}` : ''}.${result.url ? ` <a href="${escapeHtml(result.url)}" target="_blank" rel="noopener">View</a>` : ''}</p>`;
}

function summaryTools() {
  const asked = sentEvents('summarize').at(-1);
  const waiting = asked && !answerFor(asked.id);
  const draft = pendingSummaryDraft();
  const count = acceptedItems().length;
  return `${draft ? `<div class="summary-draft">${aiTag('AI draft')}<p>${escapeHtml(draft.text)}</p>
      <div class="note-actions"><button class="btn btn-outline-go" data-action="use-summary" data-event="${escapeHtml(draft.eventId)}">Replace your summary with this</button><button class="btn btn-quiet" data-action="dismiss-summary" data-event="${escapeHtml(draft.eventId)}">Keep yours</button></div></div>` : ''}
    <div class="summary-row">
      ${waiting ? '<span class="pending">The agent is writing a summary…</span>'
        : `<button class="btn btn-quiet" data-action="summarize"${count ? '' : ' disabled'}>${ICONS.ai}${state.reviewer.summary.trim() ? 'Write a new summary from your remarks' : 'Write a summary from your remarks'}</button>`}
      <span class="muted">${count ? `Uses the ${plural(count, 'remark')} that will be posted.` : 'Accept a finding or write a remark first.'}</span>
    </div>`;
}

function renderTerminus() {
  const review = state.review;
  const unseen = unseenHunks();
  const proposal = proposedVerdict();
  const verdict = state.reviewer.verdict || proposal;
  const post = buildPost('final').event;
  const general = review.findings.filter((finding) => finding.hunkId === null);
  const openFindings = review.findings.filter((finding) => decisionOf(finding) === 'open');
  const verdictButtons = VERDICTS.map((option) => `<button class="verdict${proposal && option.id !== proposal ? ' muted' : ''}" data-verdict="${option.id}" aria-pressed="${verdict === option.id}">
      <strong>${VERDICT_ICONS[option.icon]}${option.label}${option.id === proposal ? '<span class="proposed">proposed</span>' : ''}</strong><span>${option.hint}</span></button>`).join('');
  const finalVerdict = VERDICTS.find((option) => option.id === verdict);
  const warn = (verdict === 'APPROVE' || verdict === 'REQUEST_CHANGES') && unseen.length
    ? `<p class="warn">You have not seen ${unseen.length} of ${plural(review.hunks.length, 'hunk')}. <button class="btn btn-quiet" data-action="show-unseen">Show them</button></p>` : '';
  const ownPr = review.pr.isOwnPr ? `<p class="lede">This is your own PR. GitHub does not accept approve or request changes from the author; use comment.</p>` : '';
  const previewItems = previewHtml(post);
  const outdated = outdatedRemarks();
  const openGeneral = general.filter((finding) => decisionOf(finding) === 'open').length;
  const posts = `${post.body ? 'the review body and ' : ''}${plural(post.comments.length, 'comment')}`;
  const flows = state.lines.filter((line) => !line.id.startsWith('__'));
  const flowsDone = flows.filter((line) => line.stops.every((stop) => isSeen(stop.hunkId))).length;
  const criteria = criteriaCheck();
  const coverage = [
    unseen.length ? state.lines.map((line) => {
      const open = line.stops.map((stop, index) => ({ stop, index })).filter(({ stop }) => !isSeen(stop.hunkId));
      if (!open.length) return '';
      const links = open.map(({ stop, index }) => `<li>${stationButton(line, index, `${stationCode(line, index)} ${escapeHtml(hunkById(stop.hunkId)?.file || '')}`)}</li>`).join('');
      return `<div class="unseen-flow"><p class="unseen-flow-head">${bullet(line, line.id.startsWith('__'))} ${flowIcon(line)}<b>${escapeHtml(line.name)}</b><span class="term-counts">${open.length} of ${line.stops.length} not seen</span></p><ul class="unseen-list">${links}</ul></div>`;
    }).join('') : '<p class="lede">You have seen every hunk.</p>',
    outdated.length ? `<p class="lede">Remarks on hunks that changed since you wrote them. They are not posted.</p><div class="diff">${outdated.map((remark) => renderNote({ type: 'remark', item: remark })).join('')}</div>` : '',
  ].join('');
  const verdicts = hunkVerdictsCheck();
  const notPosted = notPostedFindings();
  const beforeYouPost = `<ol class="check-list">
      ${checkItem({ number: 1, done: criteria.done, key: 'criteria', title: `Acceptance criteria ${aiTag('checked by AI')}`, counts: criteria.counts, body: criteria.body })}
      ${checkItem({ number: 2, done: openGeneral === 0, key: general.length ? 'findings' : null, title: 'What the AI found for the whole PR', counts: general.length ? `${general.length}${openGeneral ? ` · ${openGeneral} open` : ' · all decided'}` : 'nothing', body: general.length ? `<div class="diff">${general.map((finding) => renderNote({ type: 'finding', item: finding })).join('')}</div>` : '', open: openGeneral > 0 })}
      ${checkItem({ number: 3, done: unseen.length === 0, key: 'coverage', title: 'Hunks and flows you have seen', counts: `${review.hunks.length - unseen.length} of ${plural(review.hunks.length, 'hunk')} · ${flows.length ? `${flowsDone} of ${plural(flows.length, 'flow')} complete` : 'no flows'}${outdated.length ? ` · ${outdated.length} remarks on changed hunks` : ''}`, body: coverage, open: outdated.length > 0 })}
      ${notPosted ? checkItem({ number: 4, key: 'not-posted', title: 'AI findings on hunks you are not posting', counts: notPosted.counts, body: notPosted.body }) : ''}
    </ol>`;
  const posted = postedReview();
  if (posted) return renderPostedTerminus(posted);
  return `<section class="terminus">
    ${draftLine()}
    <p class="lede">Nothing reaches GitHub until you press a post button.</p>
    ${hasOwnReview() ? `<p class="lede">This posts a new review with new comments. To approve the fixes or follow up on your earlier comments, <button class="btn-link" data-action="reviews">update your review</button> instead.</p>` : ''}
    ${ownPr}
    <div class="check-group"><h2>Before you post</h2>${beforeYouPost}</div>
    <div class="check-group"><h2>Your review</h2><ol class="check-list">
      ${checkItem({ number: 1, title: `Summary ${state.reviewer.summary.trim() ? statusBadge('summary', state.reviewer.summary.trim()) : ''}`, body: `<div class="summary"><textarea id="summary" data-summary placeholder="The review body: what you checked and what you want from the author." aria-label="Review summary">${escapeHtml(state.reviewer.summary)}</textarea>${summaryTools()}</div>` })}
      ${checkItem({ number: 2, done: verdicts.done, key: 'hunk-verdicts', title: 'Your verdicts per hunk', counts: verdicts.counts, body: verdicts.body })}
      ${checkItem({ number: 3, key: 'preview', title: 'What will be posted', counts: posts, body: `<div class="preview">${previewItems}</div>` })}
      ${checkItem({ number: 4, title: 'Verdict and post', body: `<div class="verdicts" role="group" aria-label="Verdict">${verdictButtons}</div>${warn}
        <p class="post-status">Posts ${posts}.${openFindings.length ? ` ${plural(openFindings.length, 'AI finding')} ${openFindings.length === 1 ? 'is' : 'are'} still open and not posted.` : ''}</p>
        <div class="post-row">
          ${finalVerdict ? `<button class="btn ${finalVerdict.button}" data-action="final">${VERDICT_ICONS[finalVerdict.icon]}${hasOwnReview() ? 'Post new review' : 'Post review'}: ${escapeHtml(finalVerdict.label.toLowerCase())}</button>` : '<button class="btn" disabled>Choose a verdict to post</button>'}
          ${draftButton()}
        </div>
        ${renderPosts()}` })}
    </ol></div>
  </section>`;
}

function criteriaHaveVerdicts(line) { return line.acceptanceCriteria.some((id) => criterionById(id)?.verdict); }

function criterionLine(id, criterion) {
  const source = criterion.source === 'description' ? '<span class="criterion-source description" title="The ticket lists no acceptance criteria; the agent took this from its description">inferred from the description</span>'
    : criterion.source === 'ticket' ? '<span class="criterion-source">acceptance criterion</span>' : '';
  return `<span class="criterion-key">${inlineMarkup(id)}</span>${inlineMarkup(criterion.text)}${source}`;
}

const AC_VERDICTS = { met: 'Met', 'not-met': 'Not met', unclear: 'Unclear' };

function ticketCriteria() { return (state.review.context.tickets || []).flatMap((ticket) => ticket.acceptanceCriteria || []); }

// One row per criterion: the agent's verdict, its note, and the flows that cover it.
function criteriaRows(criteria) {
  return criteria.map((criterion) => {
    const flows = state.lines.filter((line) => line.acceptanceCriteria.includes(criterion.id));
    const links = flows.map((line) => `<button class="btn btn-quiet" data-line="${escapeHtml(line.id)}" title="${escapeHtml(line.name)}">${bullet(line)} ${flowIcon(line)}<span class="ac-flow-name">${escapeHtml(line.name)}</span></button>`).join('');
    return `<li>
      <span class="ac-verdict ${criterion.verdict || ''}">${AC_VERDICTS[criterion.verdict] || 'Not checked'}</span>
      <span class="ac-text">${criterionLine(criterion.id, criterion)}</span>
      ${criterion.note ? `<span class="ac-note">${inlineMarkup(criterion.note)}</span>` : ''}
      ${links ? `<span class="ac-flows">${links}</span>` : '<span class="ac-note">No flow covers this criterion.</span>'}
    </li>`;
  }).join('');
}

function criteriaCheck() {
  const criteria = ticketCriteria();
  if (!criteria.length) return { done: true, counts: 'none in the linked tickets', body: '' };
  const rows = criteriaRows(criteria);
  const counts = Object.entries(AC_VERDICTS).map(([id, label]) => [criteria.filter((criterion) => criterion.verdict === id).length, label.toLowerCase()]).filter(([count]) => count).map(([count, label]) => `${count} ${label}`);
  return {
    done: criteria.every((criterion) => criterion.verdict === 'met'),
    counts: [criteria.length, ...counts].join(' · '),
    body: `<p class="lede">The agent's check of each criterion. Open a flow to see the code that should meet it.</p><ul class="ac-list">${rows}</ul>`,
  };
}

// A button that opens one hunk inside one flow.
function stationButton(line, index, label, { className = '', title = '' } = {}) {
  return `<button class="btn btn-quiet${className ? ` ${className}` : ''}" data-go="${escapeHtml(line.id)}" data-index="${index}"${title ? ` title="${escapeHtml(title)}"` : ''}>${label}</button>`;
}

function hunkLink(hunk, prefix = '') {
  const at = firstStationOf(hunk.id);
  return at ? stationButton(at.line, at.index, `${prefix}${stationCode(at.line, at.index)} ${escapeHtml(hunk.file)}`) : `${prefix}${escapeHtml(hunk.file)}`;
}

// The findings on hunks that the reviewer left open. They are not posted, and leaving them open is a valid call.
function notPostedFindings() {
  const open = state.review.findings.filter((finding) => finding.hunkId !== null && decisionOf(finding) === 'open');
  if (!open.length) return null;
  const counts = [...severities()].reverse()
    .map((severity) => ({ severity, count: open.filter((finding) => findingSeverity(finding) === severity).length }))
    .filter(({ count }) => count);
  const hunks = [...new Set(open.map((finding) => finding.hunkId))].map(hunkById).filter(Boolean);
  return {
    counts: `${open.length}: ${counts.map(({ severity, count }) => `${count} ${escapeHtml(severity)}`).join(', ')}`,
    body: `<p class="lede">You did not accept these, so they are not in the review. Accept one here to post it.</p>
      ${hunks.map((hunk) => `<div class="not-posted-hunk"><p>${hunkLink(hunk)}</p><div class="diff">${open.filter((finding) => finding.hunkId === hunk.id).map((finding) => renderNote({ type: 'finding', item: finding })).join('')}</div></div>`).join('')}`,
  };
}

function othersReviewCount() { return (state.review.reviews || []).filter((review) => review.author !== viewerLogin()).length; }

function hasOwnReview() { return (state.review.reviews || []).some((review) => review.author === viewerLogin()); }

// Replies and resolved threads of an update: only threads the reviewer made a call on, and only replies with text.
function threadPayload() {
  const disclosure = state.review.conventions.disclosure || {};
  const calls = (call) => openOwnThreads().filter((own) => threadCall(own) === call);
  return {
    resolve: calls('resolve').filter((own) => own.canResolve !== false).map((own) => own.threadId),
    replies: calls('open').map((own) => ({ own, body: (state.reviewer.threadReplies[own.threadId] || '').trim() })).filter(({ body }) => body)
      .map(({ own, body }) => ({ threadId: own.threadId, body: withDisclosure(body, body === own.fix?.reply?.trim() && disclosure.comment) })),
  };
}

// An update adds a review on top of the reviewer's earlier one. It carries no new line comments.
async function postUpdate(verdict) {
  const body = (state.reviewer.updateNote || '').trim();
  if (verdict !== 'APPROVE' && !body) return toast('Write a note to the author first. GitHub needs a body for this verdict.', true);
  const event = { type: 'post', kind: 'update', verdict, body, comments: [], ...threadPayload() };
  const id = await sendEvent(event, { at: new Date().toISOString(), payload: { verdict, body, resolve: event.resolve, replies: event.replies } });
  if (!id) return;
  // Sent replies are not sent again; a thread left open keeps its call until new commits start the next round.
  for (const reply of event.replies) state.reviewer.threadReplies[reply.threadId] = '';
  state.reviewer.updateNote = '';
  saveReviewer();
  render();
  toast('The update is on its way to GitHub.');
}

function updateStatus() {
  const last = sentEvents('post').filter((sent) => sent.kind === 'update').at(-1);
  return last ? postResultRow(last) : '';
}

// Below the reviewer's newest review: the call on each open comment becomes an update of that review.
// A review that requests changes always gets the footer, so the reviewer can approve on top of it.
function updateFooter(review) {
  const threads = openOwnThreads();
  const requested = review.state === 'CHANGES_REQUESTED';
  if (!threads.length && !requested && !sentEvents('post').some((sent) => sent.kind === 'update')) return '';
  const left = threadsWithoutCall().length;
  const open = threads.filter((own) => threadCall(own) === 'open').length;
  const note = `<textarea data-update-note aria-label="Note to the author" placeholder="Note to the author. Optional for approve, needed for request changes and comment.">${escapeHtml(state.reviewer.updateNote || '')}</textarea>`;
  const button = (verdict, label, kind) => `<button class="btn ${kind}" data-update-review="${verdict}">${VERDICT_ICONS[VERDICTS.find((option) => option.id === verdict).icon]}${label}</button>`;
  const comment = button('COMMENT', 'Update review: comment', 'btn-quiet');
  const buttons = left ? `<button class="btn" disabled>Decide on ${plural(left, 'comment')} first</button>`
    : open ? `${button('REQUEST_CHANGES', 'Update review: request changes', 'btn-danger')}${button('APPROVE', `Update review: approve (${plural(open, 'comment')} left open)`, 'btn-outline-ok')}${comment}`
    : `${button('APPROVE', 'Update review: approve', 'btn-ok')}${comment}`;
  const intro = threads.length
    ? `${threadCallCounts()}. Replies and resolved comments go to GitHub with the update.`
    : 'Your review requests changes. Approving now replaces that as your verdict.';
  return `<div class="update-footer">
    <h3>Update your review</h3>
    ${threads.length || requested ? `<p class="lede">${intro} GitHub shows the update as your newest review. It adds no new line comments: for those, <button class="btn-link" data-action="terminus">post a new review</button>.</p>
    <div class="composer">${note}</div>
    <div class="post-row">${buttons}</div>` : ''}
    ${updateStatus()}
  </div>`;
}

function threadCallCounts() {
  const threads = openOwnThreads();
  const count = (call) => threads.filter((own) => threadCall(own) === call).length;
  const left = threadsWithoutCall().length;
  return `${count('resolve')} to resolve · ${count('open')} left open${left ? ` · ${left} without a call` : ''}`;
}

function hunkVerdictsCheck() {
  const verdicts = state.reviewer.hunkVerdicts;
  const changes = state.review.hunks.filter((hunk) => verdicts[hunk.id] === 'changes');
  const approved = state.review.hunks.filter((hunk) => verdicts[hunk.id] === 'approved').length;
  const comments = state.review.hunks.filter((hunk) => verdicts[hunk.id] === 'comment').length;
  const without = hunksWithoutVerdict();
  const list = (hunks, prefix) => (hunks.length ? `<ul class="verdict-list">${hunks.map((hunk) => `<li>${hunkLink(hunk, prefix)}</li>`).join('')}</ul>` : '');
  return {
    done: without.length === 0,
    counts: `<span class="tag-approved">${approved} approved</span> · <span class="tag-changes">${changes.length} changes requested</span> · ${comments} commented · ${without.length} without`,
    body: `<p class="lede">These are local only. The page proposes a verdict once every hunk has one.</p>
      ${without.length ? `<p class="lede">Hunks without a verdict:</p>${list(without, '')}` : ''}
      ${changes.length ? `<p class="lede">Hunks where you requested changes:</p>${list(changes, `<span class="tag-changes">${VERDICT_ICONS.changes}</span>`)}` : ''}`,
  };
}

// One row of the Submit review checklist. Its marker turns into a check when the item is done,
// and its title line carries the counts, so a closed row still tells its state.
function checkItem({ number, done, key, title, counts, body, open = false }) {
  const marker = `<span class="check-marker${done ? ' done' : ''}">${done ? `${VERDICT_ICONS.approved}<span class="sr">Done:</span>` : number}</span>`;
  const head = (tag) => `${marker}<${tag} class="check-title">${title}</${tag}>${counts ? `<span class="term-counts">${counts}</span>` : ''}`;
  if (!key) return `<li class="check-item"><div class="check-head">${head('h3')}</div>${body ? `<div class="check-body">${body}</div>` : ''}</li>`;
  const isOpen = state.ui.terminusOpen?.[key] ?? open;
  return `<li class="check-item"><details${isOpen ? ' open' : ''} data-term-section="${key}"><summary class="check-head">${head('span')}</summary><div class="check-body">${body}</div></details></li>`;
}

const POST_NOUNS = { final: 'review', draft: 'draft', update: 'update' };

function postResultRow({ id, kind, at }) {
  const result = postFor(id);
  const noun = POST_NOUNS[kind];
  if (!result) return `<div class="post-result"><span class="pending">Posting the ${noun}…</span></div>`;
  if (result.status !== 'posted') return `<div class="post-result ${result.status}">GitHub refused the ${noun}: ${escapeHtml(result.message)}</div>`;
  const link = result.url ? ` <a href="${escapeHtml(result.url)}" target="_blank" rel="noopener">Open on GitHub</a>` : '';
  return `<div class="post-result posted">${noun[0].toUpperCase() + noun.slice(1)} posted${at ? ` at ${escapeHtml(timeLabel(at))}` : ''}.${link}</div>`;
}

// Updates show under the review they update, not here.
function renderPosts() {
  const posts = sentEvents('post').filter((sent) => sent.kind !== 'update');
  if (!posts.length) return '';
  return `<div class="section posts"><h3>Sent to GitHub</h3>${[...posts].reverse().map(postResultRow).join('')}</div>`;
}

// The page is drawn again on most actions; focus goes back to the same control, found by its id or its data attributes.
function captureFocus() {
  const active = document.activeElement;
  if (!active || active === document.body || !document.getElementById('app').contains(active)) return null;
  const data = [...active.attributes].filter((attribute) => attribute.name.startsWith('data-')).map((attribute) => `[${attribute.name}="${CSS.escape(attribute.value)}"]`).join('');
  return { id: active.id, selector: data ? `${active.localName}${data}` : null, start: active.selectionStart, end: active.selectionEnd };
}

function restoreFocus(focus) {
  if (state.ui.focusView) {
    state.ui.focusView = false;
    return document.querySelector('.strip h1')?.focus({ preventScroll: true });
  }
  if (!focus) return;
  const element = (focus.id && document.getElementById(focus.id)) || (focus.selector && document.querySelector(focus.selector)) || document.getElementById('main');
  element.focus({ preventScroll: true });
  if (typeof focus.start === 'number' && element.setSelectionRange) element.setSelectionRange(focus.start, focus.end);
}

// An error stays until the reviewer closes it; other messages go after five seconds.
function toast(message, isError = false) {
  announce(message, isError);
  const list = document.getElementById('toasts');
  const item = document.createElement('div');
  item.className = `toast${isError ? ' error' : ''}`;
  item.innerHTML = `<span>${escapeHtml(message)}</span><button class="toast-close" aria-label="Close this message">${ICONS.close}</button>`;
  item.querySelector('button').addEventListener('click', () => removeToast(item));
  list.append(item);
  list.classList.add('has-items');
  // Showing the list again puts it on top of the top layer, above a dialog that opened after it.
  if (list.matches?.('[popover]') && 'popover' in HTMLElement.prototype) { list.hidePopover(); list.showPopover(); }
  if (!isError) setTimeout(() => removeToast(item), 5000);
}

function removeToast(item) {
  if (!item.isConnected) return;
  item.classList.add('leaving');
  setTimeout(() => {
    const list = item.parentElement;
    item.remove();
    if (list && !list.children.length) { list.classList.remove('has-items'); if ('popover' in HTMLElement.prototype) list.hidePopover(); }
  }, reduceMotion.matches ? 0 : 220);
}

// Two live regions stay on the page for its whole life, so screen readers announce every message once.
function announce(message, urgent = false) {
  const region = document.getElementById(urgent ? 'live-assertive' : 'live-polite');
  region.textContent = '';
  setTimeout(() => { region.textContent = message; }, 50);
}

async function post(kind) {
  const { event, contents } = buildPost(kind);
  if (kind === 'draft' && contents.length === 0) {
    toast('There is nothing to put in a draft yet. Accept a finding, write a remark or a summary first.', true);
    return;
  }
  const payload = { body: event.body, comments: event.comments, verdict: event.verdict };
  const id = await sendEvent(event, { contents, at: new Date().toISOString(), headSha: state.review.pr.headSha, payload });
  if (id) toast(kind === 'final' ? 'The review is on its way to GitHub.' : 'The draft is on its way to GitHub.');
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('button');
  if (!target) return;
  const data = target.dataset;
  if (data.themeChoice) {
    state.reviewer.theme = data.themeChoice;
    saveReviewer();
    applyTheme();
    return render();
  }
  if (data.go) return go(data.go, Number(data.index));
  if (data.scrollTo) {
    return document.getElementById(data.scrollTo)?.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
  }
  if (data.line) {
    const line = lineById(data.line);
    // Back to the hunk the reviewer last had open in this flow; a flow not opened yet starts at its first unseen hunk.
    const remembered = line.stops.findIndex((stop) => stop.hunkId === state.reviewer.flowPositions?.[line.id]);
    const unseen = line.stops.findIndex((stop) => !isSeen(stop.hunkId));
    return go(line.id, remembered !== -1 ? remembered : unseen === -1 ? 0 : unseen);
  }
  if (data.threadCall) {
    const own = openOwnThreads().find((candidate) => candidate.threadId === data.thread);
    state.reviewer.threadCalls = { ...state.reviewer.threadCalls, [data.thread]: data.threadCall };
    if (data.threadCall === 'open' && state.reviewer.threadReplies[data.thread] === undefined) state.reviewer.threadReplies[data.thread] = own?.fix?.reply || '';
    saveReviewer();
    return render();
  }
  if (data.updateReview) return postUpdate(data.updateReview);
  if (data.copyComment) return copyComment((state.review.reviewComments || []).find((comment) => comment.id === data.copyComment));
  if (data.decide) {
    if (data.decision === 'open') delete state.reviewer.decisions[data.decide]; else state.reviewer.decisions[data.decide] = data.decision;
    saveReviewer(); return render();
  }
  if (data.startEdit) { state.ui.editing = data.startEdit; render(); return document.getElementById(`edit-${data.startEdit}`)?.focus(); }
  if (data.cancelEdit) { state.ui.editing = null; delete state.ui.drafts[`edit:${data.cancelEdit}`]; return render(); }
  if (data.saveEdit) {
    const value = document.getElementById(`edit-${data.saveEdit}`).value.trim();
    if (value) state.reviewer.edits[data.saveEdit] = value;
    state.ui.editing = null; delete state.ui.drafts[`edit:${data.saveEdit}`];
    saveReviewer(); return render();
  }
  // Mouse selection is handled on pointerdown; a click with detail 0 comes from the keyboard.
  if (data.remark && event.detail === 0) {
    const row = Number(data.row);
    return openComposer(composerFor(hunkById(data.remark), row, row));
  }
  if (data.selectHunk) return openComposer(wholeHunkComposer(hunkById(data.selectHunk)));
  if (data.saveRemark) {
    const remark = state.reviewer.remarks.find((candidate) => candidate.id === data.saveRemark);
    const body = document.getElementById(`edit-${data.saveRemark}`).value.trim();
    if (remark && body) Object.assign(remark, { body, severity: document.getElementById(`edit-severity-${data.saveRemark}`).value });
    state.ui.editing = null; delete state.ui.drafts[`edit:${data.saveRemark}`];
    saveReviewer(); return render();
  }
  if (data.deleteRemark) {
    state.reviewer.remarks = state.reviewer.remarks.filter((remark) => remark.id !== data.deleteRemark);
    saveReviewer(); return render();
  }
  if (data.answerRemark) {
    const answer = answerFor(data.answerRemark);
    const hunk = answer && hunkById(answer.hunkId);
    if (!hunk) return;
    const row = diffRows(hunk).find((candidate) => candidate.kind !== 'meta' && candidate.kind !== 'ctx') || diffRows(hunk)[0];
    const { side, line } = row ? rowLocation(row) : { side: 'RIGHT', line: null };
    return openComposer({ hunkId: hunk.id, startLine: line, startSide: side, line, side, text: answer.answer, aiSuggested: true });
  }
  if (data.ask) {
    const textarea = document.getElementById(`ask-${data.ask}`);
    const question = textarea.value.trim();
    if (!question) return toast('Type a question first.', true);
    delete state.ui.drafts[`ask:${data.ask}`];
    return sendEvent({ type: 'ask', hunkId: data.ask, question });
  }
  if (data.hunkVerdict) {
    state.reviewer.hunkVerdicts[data.hunk] = data.hunkVerdict;
    state.ui.stamp = data.hunk;
    saveReviewer();
    const hasRemark = state.reviewer.remarks.some((remark) => remark.hunkId === data.hunk) || state.review.findings.some((finding) => finding.hunkId === data.hunk && decisionOf(finding) === 'accepted');
    if (data.hunkVerdict !== 'approved' && !hasRemark) {
      const composer = wholeHunkComposer(hunkById(data.hunk));
      if (!composer) return step(1);
      openComposer({ ...composer, thenNext: true });
      return toast(data.hunkVerdict === 'changes' ? 'Say what should change in a remark. Adding it takes you to the next hunk.' : 'Write your comment. Adding it takes you to the next hunk.');
    }
    return step(1);
  }
  if (data.verdict) {
    state.reviewer.verdict = data.verdict;
    saveReviewer();
    render();
    const warning = document.querySelector('.terminus .warn');
    if (warning) announce(warning.firstChild.textContent);
    return;
  }
  switch (data.action) {
    case 'prev': return step(-1);
    case 'unseen': return nextUnseen();
    case 'terminus': return goTerminus();
    case 'reviews': return goReviews();
    case 'home': return goHome();
    case 'refresh': state.ui.updatingTo = state.review.remote.headSha; return sendEvent({ type: 'refresh' });
    case 'finish': return sendEvent({ type: 'finish' });
    case 'new-round': startNewRound(); return render();
    case 'show-comments': return showNewComments();
    case 'show-unseen':
      state.ui.terminusOpen = { ...state.ui.terminusOpen, coverage: true };
      render();
      return document.querySelector('[data-term-section="coverage"]')?.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
    case 'shortcuts': return document.getElementById('shortcuts').showModal();
    case 'whole-file': return showWholeFile(hunkById(data.hunk));
    case 'open-folder': return transport.openFolder(data.file).catch((error) => toast(`Cannot open the folder: ${error.message}`, true));
    case 'first': return go(lines()[0].id, 0);
    case 'draft': return post('draft');
    case 'summarize': return sendEvent({ type: 'summarize', verdict: state.reviewer.verdict || proposedVerdict(), remarks: acceptedItems().map((item) => ({ severity: item.severity, where: item.hunkId ? `${hunkById(item.hunkId)?.file || ''} ${lineLabel(item)}` : 'the whole PR', body: item.body })) });
    case 'use-summary': useSummaryDraft(data.event); return render();
    case 'dismiss-summary': state.reviewer.summaryFrom = data.event; saveReviewer(); return render();
    case 'final': return post('final');
